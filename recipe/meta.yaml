{% set name = "peewee-migrate" %}
{% set version = "2.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/peewee_migrate-{{ version }}.tar.gz
  sha256: aeefae38c24260bfb3497c69e88e0b8139141a8d9d0533f8bab27b07ddb0f246

build:
  entry_points:
    - pw_migrate = peewee_migrate.cli:cli
    - pw-migrate = peewee_migrate.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - uv-build >=0.10.2,<0.11.0
  run:
    - python >={{ python_min }},<4.0
    - peewee >=4.4
    - click

test:
  imports:
    - peewee_migrate
  commands:
    - pip check
    - pw_migrate --help
    - pw-migrate --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/klen/peewee_migrate
  summary: Support for migrations in Peewee ORM
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
